[package]
name = "sootmark-macos"
version = "0.4.0"
edition = "2021"
rust-version = "1.80"
description = "macOS artifacts for forensics: launchd jobs (LaunchAgents, LaunchDaemons), login items (backgrounditems.btm), FSEvents, quarantine events, TCC privacy permissions and KnowledgeC usage, read with sootmark-plist and sootmark-sqlite."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/macos"
homepage = "https://sootmark.com"
keywords = ["forensics", "dfir", "incident-response", "macos", "tcc"]
# Sources only: test fixtures stay in the repository.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[lib]
name = "macos"

[dependencies]
common = { package = "sootmark-common", version = "0.3.7" }
plist = { package = "sootmark-plist", version = "0.1.0" }
sqlite = { package = "sootmark-sqlite", version = "0.2.0" }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
